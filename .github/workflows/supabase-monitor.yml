name: Supabase Monitor

on:
  schedule:
    # 台灣時間約 08:17、16:17、隔日 00:17
    - cron: "17 0,8,16 * * *"

  workflow_dispatch:

jobs:
  check-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query Supabase health check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          response=$(
            curl \
              --silent \
              --show-error \
              --fail \
              --max-time 20 \
              --retry 2 \
              --retry-delay 5 \
              "${SUPABASE_URL}/rest/v1/health_check?id=eq.1&select=id,service_name" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}"
          )

          echo "Supabase response: ${response}"

          echo "${response}" | grep -q '"service_name":"database"' || {
            echo "Health-check response is incorrect."
            exit 1
          }

          echo "Supabase database is healthy."
